name: Publish dual A6000 CUDA image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # CUDA compilation needs CPU/RAM/disk but no NVIDIA device. GitHub-hosted
    # runners can run out of storage; select a larger/self-hosted runner then.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Free GitHub hosted runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/powershell || true
          df -h
      - name: Set lowercase GHCR image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.name }}:dual-a6000-v1.1
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            INSTALL_FULL_EXTENSIONS=1
            BUILD_LLAMA=1
            VCS_REF=${{ github.sha }}
            SOURCE_REPO=https://github.com/${{ github.repository }}
